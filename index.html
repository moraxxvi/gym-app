<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зал">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Зал для новичка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Чёрный + оранжевый */
  :root{--bg:#000;--card:#141414;--line:#262626;--text:#fff;--muted:#8a8a8a;--acc:#ff5a1f;--warn:#ffb648;--ok:#3ddc84;
    --head:"Oswald","Arial Narrow",Arial,sans-serif;--body:"Inter",system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);font:16px/1.5 var(--body);padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
  body.inwork{padding-bottom:24px} body.inwork nav{display:none}
  main{padding:0 16px;max-width:640px;margin:0 auto}
  h1,h2,.kicker,.btn,.tag,nav button,.cd,.stat b,.opt{font-family:var(--head);text-transform:uppercase;letter-spacing:.4px}
  h1{font-size:30px;line-height:1.1;margin:4px 0 6px} h2{font-size:18px;margin:26px 0 10px} h3{font-size:15px;margin:18px 0 6px}
  .hero{padding:22px 0 8px} .kicker{color:var(--acc);font-size:13px}
  .muted{color:var(--muted)} .small{font-size:14px} .acc{color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;margin:10px 0}
  .card.warn{border-color:var(--warn);color:var(--warn)} .card.up{border-color:var(--ok)}
  .card.pick{cursor:pointer} .card.sel{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)} .card h3{margin:0 0 4px}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px} .opts.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 12px;padding:0 16px}
  .opt{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 14px;border-radius:4px;font-size:14px;white-space:nowrap;cursor:pointer}
  .opt.on{background:var(--acc);border-color:var(--acc)}
  .btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:4px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;margin:12px 0}
  .btn.big{padding:19px;font-size:20px} .btn.ghost{background:transparent;border:1px solid var(--line)}
  .link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;padding:8px 0;cursor:pointer}
  .stats{display:flex;gap:8px;margin:10px 0} .stat{flex:1;background:var(--card);border-left:3px solid var(--acc);padding:10px 12px}
  .stat .muted{font-size:12px} .stat b{font-size:22px;display:block}
  .list{background:var(--card);border:1px solid var(--line);border-radius:4px}
  .ex{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
  .ex:first-child{border-top:0} .ex img{width:52px;height:52px;object-fit:cover;border-radius:2px;background:#fff;flex:none}
  .ex .name{font-weight:600;line-height:1.25} .grow{flex:1;min-width:0}
  .tag{color:var(--acc);font-size:14px;white-space:nowrap}
  details.other summary,details.guide summary{cursor:pointer;color:var(--muted);padding:10px 0}
  details.guide summary{color:var(--text);font-weight:600;padding:0} details.guide ul{margin-top:10px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;color:var(--muted);padding:12px 2px 14px;font-size:12px;cursor:pointer;border-top:3px solid transparent}
  nav button.on{color:var(--acc);border-top-color:var(--acc)}
  ul{padding-left:20px;margin:6px 0} li{margin:4px 0}
  dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:4px;width:min(600px,96vw);max-height:90vh;padding:18px;position:relative}
  dialog::backdrop{background:#000c} .x{position:absolute;right:10px;top:10px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
  .pics{display:flex;gap:8px;margin:12px 0} .pics figure{margin:0;flex:1} .pics img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;border-radius:2px;display:block}
  figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
  .pics.wk img{flex:1;min-width:0;aspect-ratio:4/3}
  .mmap{width:100%;max-width:300px;display:block;margin:6px auto} .mmap text{fill:var(--muted);font-size:9px}
  .wbar{display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-size:14px;color:var(--muted)}
  .prog{height:4px;background:var(--line);margin:4px 0 8px} .prog i{display:block;height:100%;background:var(--acc)}
  .wname{font-size:28px;margin-top:8px} .setinfo{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
  .setinfo b{font-family:var(--head);font-size:20px;text-transform:uppercase}
  .row{display:flex;gap:10px} .row>*{flex:1} .links{justify-content:space-between} .links>*{flex:none}
  .inputs label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;margin-top:10px}
  input,select{background:#000;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:14px;font-size:22px;width:100%;font-family:var(--head)}
  select{font-size:16px;font-family:var(--body);padding:12px}
  input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
  .err{color:var(--acc);font-size:14px;min-height:20px;margin-top:6px}
  .rest{text-align:center;padding-top:40px} .cd{font-size:96px;color:var(--acc);line-height:1;margin:16px 0}
  .rest .stats{text-align:left}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:14px}
  .cal span{padding:8px 0;border-radius:2px} .cal span.on{background:var(--acc);font-weight:700} .cal span.now{outline:1px solid var(--muted)}
  .seg{display:flex;margin:16px 0 0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .seg button{flex:1;background:var(--card);color:var(--muted);border:0;padding:11px;font:600 13px var(--head);text-transform:uppercase;cursor:pointer}
  .seg button.on{background:var(--acc);color:#fff}
  .lbl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin:8px 0}
  input.txt{font:16px var(--body);padding:12px}
  .eday .row input.txt{font:600 16px var(--body)}
  .erow{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:10px}
  .ename{font-weight:600;font-size:15px;margin-bottom:6px}
  .ectl{display:flex;align-items:center;gap:3px} .ectl span{color:var(--muted)}
  .ectl input{width:42px;flex:none;padding:8px 2px;font-size:17px;text-align:center}
  .ib,.unit{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;min-width:32px;height:38px;cursor:pointer;flex:none;font-size:15px;padding:0}
  .unit{color:var(--acc);font-size:13px;padding:0 6px} .ectl .ib:first-of-type{margin-left:auto}
  .card.sel{border-color:var(--acc)}
  .welcome{text-align:center;padding-top:48px} .wlogo{width:84px;height:84px;border-radius:18px}
  .wl{text-align:left;display:inline-block;margin:10px 0 18px;color:var(--text)} .wl li::marker{color:var(--acc)}
  .welcome .link,.hero~.link{display:block;margin:6px auto}
  .chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin:10px 0} .chk input{width:20px;height:20px;flex:none;accent-color:var(--acc)}
  a{color:var(--acc)}
  main{position:relative} .acctbtn{position:absolute;right:16px;top:22px;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--acc);color:var(--acc);font:700 16px var(--head);cursor:pointer;z-index:2}
  .btn.danger{border-color:#ff3b30;color:#ff3b30} .btn:disabled{opacity:.6}
  #tour{position:fixed;inset:0;z-index:50} .spot{position:fixed;border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.78);border:2px solid var(--acc);pointer-events:none;transition:all .25s}
  .tip{position:fixed;left:16px;right:16px;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--acc);border-radius:6px;padding:16px}
  .tip h3{margin:4px 0;font:700 20px var(--head);text-transform:uppercase} .tip p{margin:0 0 10px;color:#ddd} .tip .row{align-items:center} .tip .btn{margin:0}
  .chart{width:100%} .chart text{fill:var(--muted);font-size:10px} .chart text.hi{fill:var(--text);font-size:13px;font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="today">Сегодня</button>
  <button data-tab="plan">План</button>
  <button data-tab="lib">Упражнения</button>
  <button data-tab="progress">Прогресс</button>
  <button data-tab="guides">Гайды</button>
</nav>
<dialog id="dlg"></dialog>
<div id="tour" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="extra.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
